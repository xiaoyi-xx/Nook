<!-- 依赖库：本地与 CDN 竞速-->
<script>
(function() {
    var libs = [
        { local: 'vendor/papaparse.min.js', cdn: 'https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js' },
        { local: 'vendor/xlsx.full.min.js',  cdn: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' },
        { local: 'vendor/plotly.min.js',     cdn: 'https://cdn.plot.ly/plotly-2.35.2.min.js' }
    ];
    var loaded = {};
    function race(lib, index) {
        var key = index;
        var done = false;
        function onLoad(src) {
            if (done) return;
            done = true;
            console.log('✓ [' + lib.local + '] 使用: ' + src);
            loadNext(index + 1);
        }
        function onError(src) {
            if (done) return;
            console.warn('✗ [' + lib.local + '] 失败: ' + src);
        }
        // 本地
        var s1 = document.createElement('script');
        s1.src = lib.local;
        s1.onload = function() { onLoad(lib.local); };
        s1.onerror = function() { onError(lib.local); if (!done) tryCDN(); };
        document.head.appendChild(s1);
        // CDN
        function tryCDN() {
            var s2 = document.createElement('script');
            s2.src = lib.cdn;
            s2.onload = function() { onLoad(lib.cdn); };
            s2.onerror = function() { onError(lib.cdn); loadNext(index + 1); };
            document.head.appendChild(s2);
        }
        // 如果本地在 3 秒内没加载完，自动发起 CDN 请求
        setTimeout(function() {
            if (!done) tryCDN();
        }, 3000);
    }
    function loadNext(index) {
        if (index >= libs.length) return;
        race(libs[index], index);
    }
    loadNext(0);
})();
</script>

<script>
// ============================================================================
// FFT2D 数学核心（JavaScript 实现）
// ============================================================================

// 复数运算：用 {re, im} 对象表示复数
function cadd(a, b) { return { re: a.re + b.re, im: a.im + b.im }; }
function cmul(a, b) { return { re: a.re*b.re - a.im*b.im, im: a.re*b.im + a.im*b.re }; }
function cexpj(theta) { return { re: Math.cos(theta), im: -Math.sin(theta) }; }
function cabs(c) { return Math.sqrt(c.re*c.re + c.im*c.im); }

/**
 * 一维 DFT（JavaScript 实现）
 * x: 实数数组
 * cancelCheck: 可选，每次迭代前调用，返回 true 则取消
 * onProgress: 可选，function(k, N)，报告进度
 * 返回: 复数数组 [{re, im}, ...] 或 null（取消时）
 */
function dftJS(x, cancelCheck, onProgress) {
    const N = x.length;
    const result = [];
    for (let k = 0; k < N; k++) {
        if (cancelCheck && cancelCheck()) return null;
        if (onProgress) onProgress(k, N);
        let sum = { re: 0, im: 0 };
        for (let n = 0; n < N; n++) {
            const angle = 2 * Math.PI * k * n / N;
            const w = cexpj(angle);           // e^(-j * angle)
            sum = cadd(sum, { re: x[n] * w.re, im: x[n] * w.im });
        }
        result.push(sum);
    }
    return result;
}

/**
 * 一维 DFT，支持复数输入（用于二维变换的第二步）
 * x: 复数数组 [{re, im}, ...]
 * cancelCheck: 可选取消检查
 * 返回: 复数数组 [{re, im}, ...] 或 null
 */
function dftComplexJS(x, cancelCheck) {
    const N = x.length;
    const result = [];
    for (let k = 0; k < N; k++) {
        if (cancelCheck && cancelCheck()) return null;
        let sum = { re: 0, im: 0 };
        for (let n = 0; n < N; n++) {
            const angle = 2 * Math.PI * k * n / N;
            const w = cexpj(angle);               // e^(-j * angle)
            sum = cadd(sum, cmul(x[n], w));        // 复数乘法
        }
        result.push(sum);
    }
    return result;
}

/**
 * 二维 DFT
 * data: 二维实数数组 [time][space]
 * cancelCheck: 可选取消检查函数
 * onProgress: function(current, total)
 * 返回: 二维复数数组 或 null
 */
function dft2JS(data, cancelCheck, onProgress) {
    const rows = data.length;
    const cols = data[0].length;
    let total = rows + cols;
    let done = 0;

    // 第1步：对每一行做 DFT（实数输入 → 复数输出）
    const rowResult = [];
    for (let i = 0; i < rows; i++) {
        if (cancelCheck && cancelCheck()) return null;
        if (onProgress) onProgress(++done, total);
        rowResult.push(dftJS(data[i], cancelCheck));
        if (rowResult[i] === null) return null;
    }

    // 第2步：对每一列做 DFT（复数输入 → 复数输出）
    const colResult = [];
    for (let j = 0; j < cols; j++) {
        if (cancelCheck && cancelCheck()) return null;
        if (onProgress) onProgress(++done, total);
        const col = [];
        for (let i = 0; i < rows; i++) col.push(rowResult[i][j]);
        const colDFT = dftComplexJS(col, cancelCheck);
        if (colDFT === null) return null;
        colResult.push(colDFT);
    }

    // 转置回 row-major
    const result = [];
    for (let i = 0; i < rows; i++) {
        const row = [];
        for (let j = 0; j < cols; j++) row.push(colResult[j][i]);
        result.push(row);
    }
    return result;
}

/** FFT2D 后处理：取幅值 + 归一化 */
function dft2PostprocessJS(data, timePts, spacePts, cancelCheck) {
    const fft2 = dft2JS(data, cancelCheck);
    if (!fft2) return null;
    const factor = timePts * spacePts / 2.0;
    const result = [];
    for (let i = 0; i < timePts; i++) {
        const row = [];
        for (let j = 0; j < spacePts; j++) {
            row.push(cabs(fft2[i][j]) / factor);
        }
        result.push(row);
    }
    result[0][0] /= 2.0;
    return result;
}

/** 从 FFT2D 结果中提取指定阶次 */
function getOrderComponentJS(result, timeOrder, spaceOrder, timePts, spacePts) {
    let ti = timeOrder <= 0 ? -timeOrder : timePts - timeOrder;
    let si = spaceOrder < 0 ? spacePts + spaceOrder : spaceOrder;
    return result[ti][si];
}

/** 主入口：执行完整 FFT2D */
function computeFFT2DJS(dataMatrix, cancelCheck, onProgress) {
    if (onProgress) onProgress('正在准备数据...', 0);
    const timePts = dataMatrix.length;
    const spacePts = dataMatrix[0].length;
    const result = dft2PostprocessJS(dataMatrix, timePts, spacePts, cancelCheck);
    if (!result) return null;
    return { result, timePts, spacePts };
}

// ============================================================================
// 构建结果数据
// ============================================================================
function buildResultJS(fft2Result, maxTimeOrder, maxSpaceOrder, timePts, spacePts) {
    if (maxTimeOrder === 0) {
        maxTimeOrder = timePts % 2 === 1 ? (timePts - 1) / 2 : timePts / 2 - 1;
    }
    if (maxSpaceOrder === 0) {
        maxSpaceOrder = spacePts % 2 === 1 ? (spacePts - 1) / 2 : spacePts / 2 - 1;
    }
    maxTimeOrder = Math.abs(maxTimeOrder);
    maxSpaceOrder = Math.abs(maxSpaceOrder);

    const tOrders = [], sOrders = [];
    for (let t = -maxTimeOrder; t <= maxTimeOrder; t++) tOrders.push(t);
    for (let s = -maxSpaceOrder; s <= maxSpaceOrder; s++) sOrders.push(s);

    const values = [];
    const csvRows = ['Time\\Space,' + sOrders.join(',')];
    for (let i = 0; i < tOrders.length; i++) {
        const row = [];
        for (let j = 0; j < sOrders.length; j++) {
            const v = getOrderComponentJS(fft2Result, tOrders[i], sOrders[j], timePts, spacePts);
            row.push(v);
        }
        values.push(row);
        csvRows.push(tOrders[i] + ',' + row.join(','));
    }
    return { timeOrders: tOrders, spaceOrders: sOrders, values, tableCSV: csvRows.join('\n') };
}

// ============================================================================
// 应用状态
// ============================================================================
const state = { rawData: null, columns: [], result: null, info: null, canceled: false };

// ============================================================================
// UI 辅助
// ============================================================================
function showAlert(type, msg) {
    const el = document.getElementById('alert');
    el.className = 'alert alert-' + type;
    el.textContent = msg; el.style.display = 'block';
}
function hideAlert() { document.getElementById('alert').style.display = 'none'; }
function showSpinner(text) {
    document.getElementById('spinnerText').textContent = text || '正在计算 FFT2D...';
    document.getElementById('spinner').classList.add('show');
}
function hideSpinner() { document.getElementById('spinner').classList.remove('show'); }

// ============================================================================
// 文件读取
// ============================================================================
const $ = id => document.getElementById(id);
$('fileInput').addEventListener('change', e => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
});
const dz = $('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    hideAlert();
    $('fileName').textContent = file.name;
    $('fileInfo').style.display = 'flex';

    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            let data;
            if (ext === 'csv' || ext === 'txt') {
                const parsed = Papa.parse(e.target.result, { header: true, skipEmptyLines: true });
                data = parsed.data;
            } else if (ext === 'xlsx' || ext === 'xls') {
                const wb = XLSX.read(e.target.result, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                data = XLSX.utils.sheet_to_json(ws);
            } else {
                showAlert('error', '不支持的文件格式：.' + ext);
                return;
            }
            if (!data || data.length === 0) { showAlert('error', '文件为空'); return; }
            loadData(data);
        } catch (err) {
            showAlert('error', '解析失败：' + err.message);
        }
    };

    if (ext === 'csv' || ext === 'txt') reader.readAsText(file);
    else reader.readAsArrayBuffer(file);
}

function loadData(data) {
    const columns = Object.keys(data[0]);
    state.rawData = data;
    state.columns = columns;

    // 更新下拉菜单
    ['timeCol', 'spaceCol', 'ampCol'].forEach((id, idx) => {
        const sel = $(id); sel.innerHTML = '';
        columns.forEach(c => {
            const o = document.createElement('option');
            o.value = c; o.textContent = c; sel.appendChild(o);
        });
        sel.disabled = false;
        if (idx < columns.length) sel.selectedIndex = idx;
    });

    // 预览
    const preview = data.slice(0, 20);
    let html = '<table><thead><tr>' + columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
    preview.forEach(row => {
        html += '<tr>' + columns.map(c => '<td>' + esc(String(row[c] ?? '')) + '</td>').join('') + '</tr>';
    });
    html += '</tbody></table>';
    $('previewTable').innerHTML = html;
    $('previewSection').style.display = 'block';
    $('computeBtn').disabled = false;
    showAlert('success', '文件加载成功：' + data.length + ' 行 × ' + columns.length + ' 列');
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ============================================================================
// FFT2D 计算
// ============================================================================
function runFFT2D() {
    if (!state.rawData) { showAlert('warning', '请先打开数据文件'); return; }
    const timeCol = $('timeCol').value, spaceCol = $('spaceCol').value, ampCol = $('ampCol').value;
    if (!timeCol || !spaceCol || !ampCol) { showAlert('warning', '请选择时间列、空间列和幅值列'); return; }

    $('resultSection').style.display = 'none';
    hideAlert();
    $('computeBtn').disabled = true;
    $('exportCsvBtn').disabled = true;
    state.canceled = false;

    // 使用 setTimeout 让 UI 先更新再开始计算
    setTimeout(() => {
        try {
            // 提取数据
            const raw = state.rawData;
            const timeSet = new Set(), spaceSet = new Set();
            const map = {};
            raw.forEach(row => {
                const t = Number(row[timeCol]), s = Number(row[spaceCol]), v = Number(row[ampCol]);
                if (isNaN(t) || isNaN(s) || isNaN(v)) return;
                timeSet.add(t); spaceSet.add(s);
                const key = t + ',' + s;
                if (!map[key]) map[key] = [];
                map[key].push(v);
            });

            const times = Array.from(timeSet).sort((a, b) => a - b);
            const spaces = Array.from(spaceSet).sort((a, b) => a - b);

            // 构建矩阵
            const dataMatrix = [];
            times.forEach(t => {
                const row = [];
                spaces.forEach(s => {
                    const key = t + ',' + s;
                    const vals = map[key];
                    row.push(vals ? vals.reduce((a, b) => a + b, 0) / vals.length : 0);
                });
                dataMatrix.push(row);
            });

            if (dataMatrix.length < 3 || dataMatrix[0].length < 3) {
                showAlert('error', '数据点太少（' + dataMatrix.length + '×' + dataMatrix[0].length + '），至少需要 3×3');
                $('computeBtn').disabled = false; return;
            }

            const maxT = parseInt($('maxTimeOrder').value) || 24;
            if (maxT > 0 && dataMatrix.length <= maxT * 2) {
                if (!confirm('时间点数 ' + dataMatrix.length + ' 不满足 Nyquist 条件（需要 > ' + (maxT * 2) + '），结果可能不准确。是否继续？')) {
                    $('computeBtn').disabled = false; return;
                }
            }

            showSpinner('正在执行二维傅里叶变换...');
            const maxS = parseInt($('maxSpaceOrder').value) || 8;

            // 取消检查
            const checkCancel = () => state.canceled;

            // 进度回调
            const onProgress = (msg, pct) => {
                if (typeof msg === 'string') showSpinner(msg);
            };

            // 执行（用 setTimeout 让 UI 能刷新）
            setTimeout(() => {
                const fftResult = computeFFT2DJS(dataMatrix, checkCancel, onProgress);
                if (state.canceled) {
                    $('computeBtn').disabled = false; hideSpinner();
                    showAlert('info', '计算已取消'); return;
                }
                if (!fftResult) {
                    $('computeBtn').disabled = false; hideSpinner();
                    showAlert('error', '计算失败'); return;
                }

                const built = buildResultJS(fftResult.result, maxT, maxS, fftResult.timePts, fftResult.spacePts);
                state.result = built;
                state.info = { nTime: dataMatrix.length, nSpace: dataMatrix[0].length };

                hideSpinner();
                $('computeBtn').disabled = false;
                showResults();
            }, 50);

        } catch (err) {
            $('computeBtn').disabled = false; hideSpinner();
            showAlert('error', '计算出错：' + err.message);
        }
    }, 50);
}

// ============================================================================
// 显示结果
// ============================================================================

/** 格式化数值：避免科学计数法，保留 6 位有效数字 */
function formatVal(v) {
    if (v === 0) return '0';
    // 用 toFixed 保留 6 位小数，再去掉末尾多余的 0
    let s = v.toFixed(6);
    // 去掉末尾多余的 0（但保留至少 1 位小数精度）
    if (s.includes('.')) {
        s = s.replace(/0+$/, '');
        s = s.replace(/\.$/, '');
    }
    return s;
}

function showResults() {
    const r = state.result;
    if (!r) return;
    $('resultSection').style.display = 'block';
    $('resultInfo').textContent = '计算完成：' + state.info.nTime + ' 时间点 × ' + state.info.nSpace + ' 空间点 → FFT2D 成功';
    $('exportCsvBtn').disabled = false;

    // 表格
    let html = '<table><thead><tr><th>Time\\Space</th>';
    r.spaceOrders.forEach(s => html += '<th>' + s + '</th>');
    html += '</tr></thead><tbody>';
    for (let i = 0; i < r.timeOrders.length; i++) {
        html += '<tr><th>' + r.timeOrders[i] + '</th>';
        for (let j = 0; j < r.spaceOrders.length; j++) {
            html += '<td>' + formatVal(r.values[i][j]) + '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table>';
    $('resultTable').innerHTML = html;

    // 热力图
    const zData = r.values.map(row => row.slice());
    Plotly.newPlot('heatmapChart', [{
        z: zData, x: r.spaceOrders, y: r.timeOrders,
        type: 'heatmap', colorscale: 'Jet',
        colorbar: { title: $('zLabel').value },
        hovertemplate: '空间阶次: %{x}<br>时间阶次: %{y}<br>幅值: %{z:.6g}<extra></extra>',
    }], {
        title: $('chartTitle').value,
        xaxis: { title: $('xLabel').value },
        yaxis: { title: $('yLabel').value },
        margin: { l: 60, r: 40, t: 50, b: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    }, { responsive: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'] });

    // 3D 网格图
    const x = [], y = [], z = [];
    for (let i = 0; i < r.timeOrders.length; i++) {
        for (let j = 0; j < r.spaceOrders.length; j++) {
            y.push(r.timeOrders[i]); x.push(r.spaceOrders[j]); z.push(r.values[i][j]);
        }
    }
    const maxZ = Math.max(...z);
    Plotly.newPlot('bar3dChart', [{
        x, y, z, type: 'mesh3d', intensity: z, colorscale: 'Jet',
        showscale: true, opacity: 0.85,
        colorbar: { title: $('zLabel').value },
        hovertemplate: '空间阶次: %{x}<br>时间阶次: %{y}<br>幅值: %{z:.6g}<extra></extra>',
    }], {
        title: $('chartTitle').value,
        scene: {
            xaxis: { title: $('xLabel').value },
            yaxis: { title: $('yLabel').value },
            zaxis: { title: $('zLabel').value, range: [0, maxZ * 1.1] },
            camera: { eye: { x: 1.5, y: -1.5, z: 1.0 } },
        },
        margin: { l: 0, r: 0, t: 50, b: 0 },
        paper_bgcolor: 'rgba(0,0,0,0)',
    }, { responsive: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'] });

    switchTab('table');
}

// ============================================================================
// 标签页切换
// ============================================================================
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
    const map = { table: 0, heatmap: 1, bar3d: 2 };
    document.querySelectorAll('.tab-btn')[map[tab]].classList.add('active');
    $('tab-' + tab).classList.add('active');
    ['heatmapChart', 'bar3dChart'].forEach(id => {
        const el = $(id);
        if (el && el.data && id.includes(tab)) Plotly.Plots.resize(el);
    });
}

// ============================================================================
// 导出 CSV
// ============================================================================
function exportCSV() {
    if (!state.result) { showAlert('warning', '没有可导出的结果'); return; }
    const blob = new Blob(['\uFEFF' + state.result.tableCSV], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'FFT2D_result.csv'; a.click();
    URL.revokeObjectURL(url);
    showAlert('success', 'CSV 已下载');
}
